          EOF_8
          mkdir -p $(dirname app/src/main/java/com/example/wosclicker/MainActivity.kt)
          cat > app/src/main/java/com/example/wosclicker/MainActivity.kt <<'EOF_9'
          package com.example.wosclicker

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              companion object {
                  const val CARD = "4400430358159272"
              }

              private val cAccent = Color.parseColor("#5AB8FF")
              private val cDark = Color.parseColor("#0A1628")
              private val cMuted = Color.parseColor("#9FB7D6")
              private val cGreen = Color.parseColor("#3DDC84")
              private val cRed = Color.parseColor("#FF5C5C")

              private var tab = 0
              private var statusDot: View? = null
              private var statusText: TextView? = null
              private var enableBtn: TextView? = null
              private var maxEdit: EditText? = null
              private var delayEdit: EditText? = null
              private val rowViews = ArrayList<TextView>()

              // ---------- helpers ----------

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun rounded(fill: Int, radiusDp: Int, strokeColor: Int, strokeDp: Int): GradientDrawable {
                  val d = GradientDrawable()
                  d.shape = GradientDrawable.RECTANGLE
                  d.cornerRadius = dp(radiusDp).toFloat()
                  d.setColor(fill)
                  if (strokeDp > 0) d.setStroke(dp(strokeDp), strokeColor)
                  return d
              }

              private fun matchWrap(topDp: Int): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  )
                  p.topMargin = dp(topDp)
                  return p
              }

              private fun text(t: String, size: Float, color: Int, bold: Boolean): TextView {
                  val v = TextView(this)
                  v.text = t
                  v.textSize = size
                  v.setTextColor(color)
                  if (bold) v.setTypeface(null, Typeface.BOLD)
                  return v
              }

              private fun card(): LinearLayout {
                  val c = LinearLayout(this)
                  c.orientation = LinearLayout.VERTICAL
                  c.setPadding(dp(18), dp(16), dp(18), dp(18))
                  c.background = rounded(Color.parseColor("#1AFFFFFF"), 20, Color.parseColor("#33FFFFFF"), 1)
                  c.layoutParams = matchWrap(16)
                  return c
              }

              private fun button(t: String, fill: Int, textColor: Int): TextView {
                  val v = text(t, 16f, textColor, true)
                  v.gravity = Gravity.CENTER
                  v.setPadding(dp(16), dp(14), dp(16), dp(14))
                  v.background = rounded(fill, 16, 0, 0)
                  v.layoutParams = matchWrap(14)
                  return v
              }

              private fun input(value: String): EditText {
                  val e = EditText(this)
                  e.setText(value)
                  e.setTextColor(Color.WHITE)
                  e.textSize = 16f
                  e.inputType = InputType.TYPE_CLASS_NUMBER
                  e.setPadding(dp(14), dp(10), dp(14), dp(10))
                  e.background = rounded(Color.parseColor("#33000000"), 12, Color.parseColor("#33FFFFFF"), 1)
                  e.layoutParams = matchWrap(6)
                  return e
              }

              private fun newRow(): TextView {
                  val v = text("", 16f, Color.WHITE, false)
                  v.setPadding(dp(14), dp(12), dp(14), dp(12))
                  v.layoutParams = matchWrap(8)
                  return v
              }

              private fun styleRow(v: TextView, label: String, selected: Boolean) {
                  v.text = (if (selected) "●  " else "○  ") + label
                  v.setTextColor(if (selected) cDark else Color.WHITE)
                  v.setTypeface(null, if (selected) Typeface.BOLD else Typeface.NORMAL)
                  v.background = if (selected) {
                      rounded(cAccent, 12, 0, 0)
                  } else {
                      rounded(Color.parseColor("#14FFFFFF"), 12, Color.parseColor("#26FFFFFF"), 1)
                  }
              }

              // ---------- lifecycle ----------

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  ClickService.loadPrefs(this)
                  val sp = getSharedPreferences("wos", Context.MODE_PRIVATE)
                  val saved = sp.getString("lang", null)
                  L.lang = if (saved != null && L.codes.contains(saved)) {
                      saved
                  } else {
                      val sys = Locale.getDefault().language
                      if (L.codes.contains(sys)) sys else "en"
                  }
                  window.statusBarColor = Color.parseColor("#0A1628")
                  window.navigationBarColor = Color.parseColor("#0A1628")
                  render()
              }

              override fun onResume() {
                  super.onResume()
                  refreshStatus()
              }

              override fun onPause() {
                  super.onPause()
                  saveSettings()
              }

              // ---------- screens ----------

              private fun render() {
                  saveSettings()
                  rowViews.clear()
                  statusDot = null
                  statusText = null
                  enableBtn = null
                  maxEdit = null
                  delayEdit = null

                  val outer = LinearLayout(this)
                  outer.orientation = LinearLayout.VERTICAL
                  outer.background = GradientDrawable(
                      GradientDrawable.Orientation.TOP_BOTTOM,
                      intArrayOf(Color.parseColor("#0A1628"), Color.parseColor("#1B4B82"))
                  )
                  outer.layoutDirection = if (L.lang == "ar") View.LAYOUT_DIRECTION_RTL else View.LAYOUT_DIRECTION_LTR

                  val scroll = ScrollView(this)
                  scroll.isFillViewport = true
                  outer.addView(scroll, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))

                  val page = LinearLayout(this)
                  page.orientation = LinearLayout.VERTICAL
                  page.setPadding(dp(20), dp(48), dp(20), dp(24))
                  scroll.addView(page)

                  page.addView(text("❄  WOS Clicker", 30f, Color.WHITE, true))
                  val sub = text(L.t("sub"), 14f, cMuted, false)
                  sub.layoutParams = matchWrap(4)
                  page.addView(sub)

                  when (tab) {
                      0 -> buildHome(page)
                      1 -> buildSettings(page)
                      else -> buildSupport(page)
                  }

                  outer.addView(buildTabBar())
                  setContentView(outer)
                  refreshStatus()
              }

              private fun buildTabBar(): LinearLayout {
                  val bar = LinearLayout(this)
                  bar.orientation = LinearLayout.HORIZONTAL
                  bar.setBackgroundColor(Color.parseColor("#F00A1628"))
                  bar.setPadding(dp(8), dp(6), dp(8), dp(10))
                  val icons = listOf("🏠", "⚙️", "❤️")
                  val labels = listOf(L.t("tab_home"), L.t("tab_settings"), L.t("tab_support"))
                  for (i in 0 until 3) {
                      val selected = i == tab
                      val t = text(icons[i] + "\n" + labels[i], 12f, if (selected) cDark else cMuted, selected)
                      t.gravity = Gravity.CENTER
                      t.setPadding(dp(4), dp(8), dp(4), dp(8))
                      t.background = if (selected) rounded(cAccent, 14, 0, 0) else rounded(Color.TRANSPARENT, 14, 0, 0)
                      val lp = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      lp.setMargins(dp(4), 0, dp(4), 0)
                      t.layoutParams = lp
                      t.setOnClickListener {
                          tab = i
                          render()
                      }
                      bar.addView(t)
                  }
                  return bar
              }

              private fun buildHome(page: LinearLayout) {
                  // Статус службы
                  val statusCard = card()
                  val statusRow = LinearLayout(this)
                  statusRow.orientation = LinearLayout.HORIZONTAL
                  statusRow.gravity = Gravity.CENTER_VERTICAL
                  val dot = View(this)
                  val dotLp = LinearLayout.LayoutParams(dp(12), dp(12))
                  dotLp.marginEnd = dp(10)
                  dot.layoutParams = dotLp
                  val st = text("", 16f, Color.WHITE, true)
                  statusRow.addView(dot)
                  statusRow.addView(st)
                  statusCard.addView(statusRow)
                  val eb = button(L.t("enable"), cAccent, cDark)
                  eb.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  statusCard.addView(eb)
                  page.addView(statusCard)
                  statusDot = dot
                  statusText = st
                  enableBtn = eb

                  // Параметр
                  val paramCard = card()
                  paramCard.addView(text(L.t("param_title"), 12f, cMuted, true))
                  for (i in 0 until 6) {
                      val row = newRow()
                      row.setOnClickListener {
                          ClickService.row = i
                          ClickService.savePrefs(this)
                          refreshRows()
                      }
                      rowViews.add(row)
                      paramCard.addView(row)
                  }
                  page.addView(paramCard)
                  refreshRows()

                  // Старт
                  val show = button(L.t("show"), cGreen, cDark)
                  show.layoutParams = matchWrap(20)
                  show.setOnClickListener {
                      saveSettings()
                      val svc = ClickService.instance
                      if (svc == null) {
                          Toast.makeText(this, L.t("need_service"), Toast.LENGTH_LONG).show()
                      } else {
                          svc.showOverlay()
                          Toast.makeText(this, L.t("started"), Toast.LENGTH_LONG).show()
                      }
                  }
                  page.addView(show)

                  val hint = text(L.t("hint"), 13f, cMuted, false)
                  hint.setLineSpacing(0f, 1.2f)
                  hint.layoutParams = matchWrap(18)
                  page.addView(hint)
              }

              private fun buildSettings(page: LinearLayout) {
                  // Язык
                  val langCard = card()
                  langCard.addView(text(L.t("lang_title"), 12f, cMuted, true))
                  for (i in L.codes.indices) {
                      val row = newRow()
                      styleRow(row, L.langNames[i], L.codes[i] == L.lang)
                      row.setOnClickListener {
                          L.lang = L.codes[i]
                          getSharedPreferences("wos", Context.MODE_PRIVATE).edit().putString("lang", L.codes[i]).apply()
                          render()
                      }
                      langCard.addView(row)
                  }
                  page.addView(langCard)

                  // Параметры работы
                  val setCard = card()
                  setCard.addView(text(L.t("settings_title"), 12f, cMuted, true))
                  val l1 = text(L.t("max_tries"), 14f, Color.WHITE, false)
                  l1.layoutParams = matchWrap(10)
                  setCard.addView(l1)
                  val me = input(ClickService.maxTries.toString())
                  setCard.addView(me)
                  val l2 = text(L.t("delay"), 14f, Color.WHITE, false)
                  l2.layoutParams = matchWrap(12)
                  setCard.addView(l2)
                  val de = input(ClickService.delayMs.toString())
                  setCard.addView(de)
                  page.addView(setCard)
                  maxEdit = me
                  delayEdit = de
              }

              private fun buildSupport(page: LinearLayout) {
                  val c = card()

                  val heart = text("❤️", 40f, cRed, false)
                  heart.gravity = Gravity.CENTER
                  c.addView(heart)

                  val title = text(L.t("support_title"), 22f, Color.WHITE, true)
                  title.gravity = Gravity.CENTER
                  title.layoutParams = matchWrap(6)
                  c.addView(title)

                  val body = text(L.t("support_text"), 14f, cMuted, false)
                  body.gravity = Gravity.CENTER
                  body.setLineSpacing(0f, 1.2f)
                  body.layoutParams = matchWrap(10)
                  c.addView(body)

                  // «Банковская карта»
                  val bank = LinearLayout(this)
                  bank.orientation = LinearLayout.VERTICAL
                  bank.layoutDirection = View.LAYOUT_DIRECTION_LTR
                  bank.setPadding(dp(22), dp(20), dp(22), dp(22))
                  val bg = GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      intArrayOf(Color.parseColor("#2B7FFF"), Color.parseColor("#7A5CFF"))
                  )
                  bg.cornerRadius = dp(20).toFloat()
                  bank.background = bg
                  bank.layoutParams = matchWrap(18)

                  val chip = View(this)
                  chip.background = rounded(Color.parseColor("#E6C766"), 6, 0, 0)
                  chip.layoutParams = LinearLayout.LayoutParams(dp(40), dp(28))
                  bank.addView(chip)

                  val label = text(L.t("card_label"), 11f, Color.parseColor("#CCFFFFFF"), true)
                  label.layoutParams = matchWrap(18)
                  bank.addView(label)

                  val grouped = CARD.chunked(8).joinToString("\n") { it.chunked(4).joinToString(" ") }
                  val num = text(grouped, 26f, Color.WHITE, true)
                  num.setTypeface(Typeface.MONOSPACE, Typeface.BOLD)
                  num.textDirection = View.TEXT_DIRECTION_LTR
                  num.setLineSpacing(0f, 1.15f)
                  num.setTextIsSelectable(true)
                  num.layoutParams = matchWrap(4)
                  bank.addView(num)
                  c.addView(bank)

                  val copy = button(L.t("copy"), cAccent, cDark)
                  copy.setOnClickListener {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("card", CARD))
                      Toast.makeText(this, L.t("copied"), Toast.LENGTH_SHORT).show()
                  }
                  c.addView(copy)

                  val thanks = text(L.t("thanks"), 14f, cGreen, true)
                  thanks.gravity = Gravity.CENTER
                  thanks.layoutParams = matchWrap(16)
                  c.addView(thanks)

                  page.addView(c)
              }

              // ---------- state ----------

              private fun refreshRows() {
                  for (i in rowViews.indices) {
                      styleRow(rowViews[i], L.t("stat$i"), i == ClickService.row)
                  }
              }

              private fun refreshStatus() {
                  val dotView = statusDot ?: return
                  val st = statusText ?: return
                  val eb = enableBtn ?: return
                  val on = ClickService.instance != null
                  val d = GradientDrawable()
                  d.shape = GradientDrawable.OVAL
                  d.setColor(if (on) cGreen else cRed)
                  dotView.background = d
                  st.text = if (on) L.t("svc_on") else L.t("svc_off")
                  eb.visibility = if (on) View.GONE else View.VISIBLE
              }

              private fun saveSettings() {
                  val m = maxEdit
                  val d = delayEdit
                  if (m == null || d == null) return
                  ClickService.maxTries = (m.text.toString().toIntOrNull() ?: 300).coerceAtLeast(1)
                  ClickService.delayMs = (d.text.toString().toLongOrNull() ?: 1300L).coerceAtLeast(300L)
                  ClickService.savePrefs(this)
              }
          }
          EOF_9
          mkdir -p $(dirname app/src/main/java/com/example/wosclicker/ClickService.kt)
          cat > app/src/main/java/com/example/wosclicker/ClickService.kt <<'EOF_10'
          package com.example.wosclicker

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Display
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.TextView
          import kotlin.math.abs

          class ClickService : AccessibilityService() {

              companion object {
                  var instance: ClickService? = null
                  var row: Int = 4
                  var maxTries: Int = 300
                  var delayMs: Long = 1300L

                  // Опорные координаты со скриншота 1189 x 2576
                  const val REF_W = 1189f
                  const val REF_H = 2576f
                  val ROW_Y = floatArrayOf(1228f, 1360f, 1488f, 1618f, 1748f, 1878f)
                  const val ARROW_X = 1057f
                  val BTN_RETRY = floatArrayOf(352f, 2272f)
                  val BTN_REPLACE = floatArrayOf(836f, 2272f)
                  val BTN_COMPLETE = floatArrayOf(595f, 2285f)
                  // Точка внутри большой кнопки "Соверш." (в другом режиме тут пустой промежуток между кнопками)
                  val COMPLETE_CHECK = floatArrayOf(595f, 2235f)

                  fun loadPrefs(ctx: Context) {
                      val sp = ctx.getSharedPreferences("wos", Context.MODE_PRIVATE)
                      row = sp.getInt("row", row).coerceIn(0, 5)
                      maxTries = sp.getInt("max", maxTries)
                      delayMs = sp.getLong("delay", delayMs)
                  }

                  fun savePrefs(ctx: Context) {
                      ctx.getSharedPreferences("wos", Context.MODE_PRIVATE).edit()
                          .putInt("row", row)
                          .putInt("max", maxTries)
                          .putLong("delay", delayMs)
                          .apply()
                  }
              }

              private val handler = Handler(Looper.getMainLooper())
              private var running = false
              private var tries = 0
              private var btn: TextView? = null

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  loadPrefs(this)
                  showOverlay()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {
                  running = false
                  setLabel("▶ START")
              }

              override fun onDestroy() {
                  instance = null
                  running = false
                  super.onDestroy()
              }

              private fun pill(color: Int): GradientDrawable {
                  val d = GradientDrawable()
                  d.shape = GradientDrawable.RECTANGLE
                  d.cornerRadius = dp(24).toFloat()
                  d.setColor(color)
                  d.setStroke(dp(2), Color.parseColor("#99FFFFFF"))
                  return d
              }

              private fun setLabel(t: String) {
                  val b = btn ?: return
                  b.text = t
                  b.background = pill(Color.parseColor(if (running) "#E5484D" else "#2B7FFF"))
              }

              private fun toggle() {
                  running = !running
                  if (running) {
                      tries = 0
                      setLabel("■ STOP")
                      step()
                  } else {
                      setLabel("▶ START")
                  }
              }

              fun showOverlay() {
                  if (btn != null) return
                  val manager = getSystemService(WINDOW_SERVICE) as WindowManager
                  val b = TextView(this)
                  b.textSize = 14f
                  b.setTextColor(Color.WHITE)
                  b.setTypeface(null, Typeface.BOLD)
                  b.gravity = Gravity.CENTER
                  b.setPadding(dp(18), dp(10), dp(18), dp(10))
                  b.elevation = dp(6).toFloat()

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = dp(12)
                  lp.y = dp(120)

                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f
                  var moved = false
                  b.setOnTouchListener { v, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = lp.x
                              startY = lp.y
                              touchX = e.rawX
                              touchY = e.rawY
                              moved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - touchX).toInt()
                              val dy = (e.rawY - touchY).toInt()
                              if (abs(dx) > dp(6) || abs(dy) > dp(6)) moved = true
                              if (moved) {
                                  lp.x = startX + dx
                                  lp.y = startY + dy
                                  manager.updateViewLayout(v, lp)
                              }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) toggle()
                              true
                          }
                          else -> false
                      }
                  }

                  manager.addView(b, lp)
                  btn = b
                  setLabel("▶ START")
              }

              private fun step() {
                  if (!running) return
                  if (tries >= maxTries) {
                      running = false
                      setLabel("✔ DONE")
                      return
                  }
                  takeScreenshot(
                      Display.DEFAULT_DISPLAY,
                      mainExecutor,
                      object : TakeScreenshotCallback {
                          override fun onSuccess(result: ScreenshotResult) {
                              val hw = result.hardwareBuffer
                              val hwBmp = Bitmap.wrapHardwareBuffer(hw, result.colorSpace)
                              if (hwBmp == null) {
                                  hw.close()
                                  handler.postDelayed({ step() }, 1500)
                                  return
                              }
                              val bmp = hwBmp.copy(Bitmap.Config.ARGB_8888, false)
                              hwBmp.recycle()
                              hw.close()
                              decide(bmp)
                          }

                          override fun onFailure(errorCode: Int) {
                              handler.postDelayed({ step() }, 1500)
                          }
                      }
                  )
              }

              private fun isBrightBlue(bmp: Bitmap, refX: Float, refY: Float): Boolean {
                  val cx = (refX / REF_W * bmp.width).toInt()
                  val cy = (refY / REF_H * bmp.height).toInt()
                  val half = (0.008f * bmp.width).toInt()
                  var hit = 0
                  var total = 0
                  for (x in maxOf(cx - half, 0) until minOf(cx + half, bmp.width)) {
                      for (y in maxOf(cy - half, 0) until minOf(cy + half, bmp.height)) {
                          val p = bmp.getPixel(x, y)
                          total++
                          if (Color.blue(p) > 220 && Color.green(p) > 130 && Color.red(p) < 150) hit++
                      }
                  }
                  return total > 0 && hit * 100 / total >= 70
              }

              private fun decide(bmp: Bitmap) {
                  val w = bmp.width
                  val h = bmp.height

                  // Экран с большой кнопкой "Соверш." -> нажать её, чтобы начать новую попытку
                  if (isBrightBlue(bmp, COMPLETE_CHECK[0], COMPLETE_CHECK[1])) {
                      bmp.recycle()
                      setLabel("■ $tries  ✔")
                      tap(BTN_COMPLETE[0] / REF_W * w, BTN_COMPLETE[1] / REF_H * h)
                      handler.postDelayed({ step() }, delayMs)
                      return
                  }

                  val cx = (ARROW_X / REF_W * w).toInt()
                  val cy = (ROW_Y[row] / REF_H * h).toInt()
                  val half = (0.03f * w).toInt()
                  var green = 0
                  var red = 0
                  val x0 = maxOf(cx - half, 0)
                  val x1 = minOf(cx + half, w)
                  val y0 = maxOf(cy - half, 0)
                  val y1 = minOf(cy + half, h)
                  for (x in x0 until x1) {
                      for (y in y0 until y1) {
                          val p = bmp.getPixel(x, y)
                          val r = Color.red(p)
                          val g = Color.green(p)
                          val bl = Color.blue(p)
                          if (g > 150 && r < 130 && bl < 130) green++
                          else if (r > 170 && g < 110 && bl < 110) red++
                      }
                  }
                  bmp.recycle()

                  val replace = green > 40 && green > red
                  val target = if (replace) BTN_REPLACE else BTN_RETRY
                  setLabel("■ ${tries + 1}  G$green R$red")
                  tap(target[0] / REF_W * w, target[1] / REF_H * h)
                  tries++
                  handler.postDelayed({ step() }, delayMs)
              }

              private fun tap(x: Float, y: Float) {
                  val path = Path()
                  path.moveTo(x, y)
                  val stroke = GestureDescription.StrokeDescription(path, 0, 60)
                  val gesture = GestureDescription.Builder().addStroke(stroke).build()
                  dispatchGesture(gesture, null, null)
              }
          }
          EOF_10

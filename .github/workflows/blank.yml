name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p $(dirname settings.gradle)
          cat > settings.gradle <<'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "WosClicker"
          include(":app")
          EOF_0
          mkdir -p $(dirname build.gradle)
          cat > build.gradle <<'EOF_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF_1
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_2
          mkdir -p $(dirname app/build.gradle)
          cat > app/build.gradle <<'EOF_3'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.wosclicker'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.wosclicker"
                  minSdk 30
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF_3
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".ClickService" android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>
                  </service>
              </application>
          </manifest>
          EOF_4
          mkdir -p $(dirname app/src/main/res/values/strings.xml)
          cat > app/src/main/res/values/strings.xml <<'EOF_5'
          <resources>
              <string name="app_name">WOS Clicker</string>
          </resources>
          EOF_5
          mkdir -p $(dirname app/src/main/res/xml/accessibility_service_config.xml)
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF_6'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:description="@string/app_name"
              android:notificationTimeout="100" />
          EOF_6
          mkdir -p $(dirname app/src/main/res/drawable/ic_launcher.xml)
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_7'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path
                  android:fillColor="#0F2A4D"
                  android:pathData="M48,48m-48,0a48,48 0,1 1,96 0a48,48 0,1 1,-96 0" />
              <path
                  android:strokeColor="#5AB8FF"
                  android:strokeWidth="5"
                  android:strokeLineCap="round"
                  android:pathData="M48,18L48,78M22,33L74,63M22,63L74,33" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M48,48m-6,0a6,6 0,1 1,12 0a6,6 0,1 1,-12 0" />
          </vector>
          EOF_7
          mkdir -p $(dirname app/src/main/java/com/example/wosclicker/MainActivity.kt)
          cat > app/src/main/java/com/example/wosclicker/MainActivity.kt <<'EOF_8'
          package com.example.wosclicker

          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private val cAccent = Color.parseColor("#5AB8FF")
              private val cDark = Color.parseColor("#0A1628")
              private val cMuted = Color.parseColor("#9FB7D6")
              private val cGreen = Color.parseColor("#3DDC84")
              private val cRed = Color.parseColor("#FF5C5C")

              private val names = listOf(
                  "Смертоносность пехоты", "Здоровье пехоты",
                  "Смертоносность копейщиков", "Здоровье копейщиков",
                  "Смертоносность стрелков", "Здоровье стрелков"
              )

              private lateinit var statusDot: View
              private lateinit var statusText: TextView
              private lateinit var enableBtn: TextView
              private lateinit var maxEdit: EditText
              private lateinit var delayEdit: EditText
              private val rowViews = ArrayList<TextView>()

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun rounded(fill: Int, radiusDp: Int, strokeColor: Int = 0, strokeDp: Int = 0): GradientDrawable {
                  val d = GradientDrawable()
                  d.shape = GradientDrawable.RECTANGLE
                  d.cornerRadius = dp(radiusDp).toFloat()
                  d.setColor(fill)
                  if (strokeDp > 0) d.setStroke(dp(strokeDp), strokeColor)
                  return d
              }

              private fun matchWrap(topDp: Int): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  )
                  p.topMargin = dp(topDp)
                  return p
              }

              private fun text(t: String, size: Float, color: Int, bold: Boolean): TextView {
                  val v = TextView(this)
                  v.text = t
                  v.textSize = size
                  v.setTextColor(color)
                  if (bold) v.setTypeface(null, Typeface.BOLD)
                  return v
              }

              private fun card(): LinearLayout {
                  val c = LinearLayout(this)
                  c.orientation = LinearLayout.VERTICAL
                  c.setPadding(dp(18), dp(16), dp(18), dp(18))
                  c.background = rounded(Color.parseColor("#1AFFFFFF"), 20, Color.parseColor("#33FFFFFF"), 1)
                  c.layoutParams = matchWrap(16)
                  return c
              }

              private fun button(t: String, fill: Int, textColor: Int): TextView {
                  val v = text(t, 16f, textColor, true)
                  v.gravity = Gravity.CENTER
                  v.setPadding(dp(16), dp(14), dp(16), dp(14))
                  v.background = rounded(fill, 16, 0, 0)
                  v.layoutParams = matchWrap(14)
                  return v
              }

              private fun input(value: String): EditText {
                  val e = EditText(this)
                  e.setText(value)
                  e.setTextColor(Color.WHITE)
                  e.textSize = 16f
                  e.inputType = InputType.TYPE_CLASS_NUMBER
                  e.setPadding(dp(14), dp(10), dp(14), dp(10))
                  e.background = rounded(Color.parseColor("#33000000"), 12, Color.parseColor("#33FFFFFF"), 1)
                  e.layoutParams = matchWrap(6)
                  return e
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  ClickService.loadPrefs(this)

                  window.statusBarColor = Color.parseColor("#0A1628")
                  window.navigationBarColor = Color.parseColor("#1B4B82")

                  val scroll = ScrollView(this)
                  scroll.isFillViewport = true
                  scroll.background = GradientDrawable(
                      GradientDrawable.Orientation.TOP_BOTTOM,
                      intArrayOf(Color.parseColor("#0A1628"), Color.parseColor("#1B4B82"))
                  )

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(20), dp(48), dp(20), dp(32))
                  scroll.addView(root)

                  // Заголовок
                  root.addView(text("❄  WOS Clicker", 30f, Color.WHITE, true))
                  val sub = text("Автоулучшение параметров питомцев", 14f, cMuted, false)
                  sub.layoutParams = matchWrap(4)
                  root.addView(sub)

                  // Статус службы
                  val statusCard = card()
                  val statusRow = LinearLayout(this)
                  statusRow.orientation = LinearLayout.HORIZONTAL
                  statusRow.gravity = Gravity.CENTER_VERTICAL
                  statusDot = View(this)
                  val dotLp = LinearLayout.LayoutParams(dp(12), dp(12))
                  dotLp.rightMargin = dp(10)
                  statusDot.layoutParams = dotLp
                  statusText = text("", 16f, Color.WHITE, true)
                  statusRow.addView(statusDot)
                  statusRow.addView(statusText)
                  statusCard.addView(statusRow)
                  enableBtn = button("Включить службу доступности", cAccent, cDark)
                  enableBtn.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  statusCard.addView(enableBtn)
                  root.addView(statusCard)

                  // Выбор параметра
                  val paramCard = card()
                  paramCard.addView(text("ПАРАМЕТР ДЛЯ УЛУЧШЕНИЯ", 12f, cMuted, true))
                  for (i in names.indices) {
                      val row = text(names[i], 16f, Color.WHITE, false)
                      row.setPadding(dp(14), dp(12), dp(14), dp(12))
                      row.layoutParams = matchWrap(8)
                      row.setOnClickListener {
                          ClickService.row = i
                          ClickService.savePrefs(this)
                          refreshRows()
                      }
                      rowViews.add(row)
                      paramCard.addView(row)
                  }
                  root.addView(paramCard)
                  refreshRows()

                  // Настройки
                  val setCard = card()
                  setCard.addView(text("НАСТРОЙКИ", 12f, cMuted, true))
                  val l1 = text("Максимум попыток", 14f, Color.WHITE, false)
                  l1.layoutParams = matchWrap(10)
                  setCard.addView(l1)
                  maxEdit = input(ClickService.maxTries.toString())
                  setCard.addView(maxEdit)
                  val l2 = text("Пауза после нажатия, мс", 14f, Color.WHITE, false)
                  l2.layoutParams = matchWrap(12)
                  setCard.addView(l2)
                  delayEdit = input(ClickService.delayMs.toString())
                  setCard.addView(delayEdit)
                  root.addView(setCard)

                  // Главная кнопка
                  val show = button("▶  Показать кнопку START", cGreen, cDark)
                  show.layoutParams = matchWrap(20)
                  show.setOnClickListener {
                      saveSettings()
                      val svc = ClickService.instance
                      if (svc == null) {
                          Toast.makeText(this, "Сначала включите службу доступности", Toast.LENGTH_LONG).show()
                      } else {
                          svc.showOverlay()
                          Toast.makeText(this, "Откройте игру и нажмите START", Toast.LENGTH_LONG).show()
                      }
                  }
                  root.addView(show)

                  // Подсказка
                  val hint = text(
                      "1. Включите службу доступности\n" +
                      "2. Откройте игру на экране улучшения питомца\n" +
                      "3. Нажмите START. Кнопку можно перетащить пальцем",
                      13f, cMuted, false
                  )
                  hint.setLineSpacing(0f, 1.2f)
                  hint.layoutParams = matchWrap(18)
                  root.addView(hint)

                  setContentView(scroll)
              }

              private fun refreshRows() {
                  for (i in rowViews.indices) {
                      val selected = i == ClickService.row
                      val v = rowViews[i]
                      v.text = (if (selected) "●  " else "○  ") + names[i]
                      v.setTextColor(if (selected) cDark else Color.WHITE)
                      v.setTypeface(null, if (selected) Typeface.BOLD else Typeface.NORMAL)
                      v.background = if (selected) {
                          rounded(cAccent, 12, 0, 0)
                      } else {
                          rounded(Color.parseColor("#14FFFFFF"), 12, Color.parseColor("#26FFFFFF"), 1)
                      }
                  }
              }

              private fun refreshStatus() {
                  val on = ClickService.instance != null
                  val dot = GradientDrawable()
                  dot.shape = GradientDrawable.OVAL
                  dot.setColor(if (on) cGreen else cRed)
                  statusDot.background = dot
                  statusText.text = if (on) "Служба включена" else "Служба выключена"
                  enableBtn.visibility = if (on) View.GONE else View.VISIBLE
              }

              private fun saveSettings() {
                  ClickService.maxTries = (maxEdit.text.toString().toIntOrNull() ?: 300).coerceAtLeast(1)
                  ClickService.delayMs = (delayEdit.text.toString().toLongOrNull() ?: 1300L).coerceAtLeast(300L)
                  ClickService.savePrefs(this)
              }

              override fun onResume() {
                  super.onResume()
                  refreshStatus()
              }

              override fun onPause() {
                  super.onPause()
                  saveSettings()
              }
          }
          EOF_8
          mkdir -p $(dirname app/src/main/java/com/example/wosclicker/ClickService.kt)
          cat > app/src/main/java/com/example/wosclicker/ClickService.kt <<'EOF_9'
          package com.example.wosclicker

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Display
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.TextView
          import kotlin.math.abs

          class ClickService : AccessibilityService() {

              companion object {
                  var instance: ClickService? = null
                  var row: Int = 4
                  var maxTries: Int = 300
                  var delayMs: Long = 1300L

                  // Опорные координаты со скриншота 1189 x 2576
                  const val REF_W = 1189f
                  const val REF_H = 2576f
                  val ROW_Y = floatArrayOf(1228f, 1360f, 1488f, 1618f, 1748f, 1878f)
                  const val ARROW_X = 1057f
                  val BTN_RETRY = floatArrayOf(352f, 2272f)
                  val BTN_REPLACE = floatArrayOf(836f, 2272f)
                  val BTN_COMPLETE = floatArrayOf(595f, 2285f)
                  // Точка внутри большой кнопки "Соверш." (в другом режиме тут пустой промежуток между кнопками)
                  val COMPLETE_CHECK = floatArrayOf(595f, 2235f)

                  fun loadPrefs(ctx: Context) {
                      val sp = ctx.getSharedPreferences("wos", Context.MODE_PRIVATE)
                      row = sp.getInt("row", row).coerceIn(0, 5)
                      maxTries = sp.getInt("max", maxTries)
                      delayMs = sp.getLong("delay", delayMs)
                  }

                  fun savePrefs(ctx: Context) {
                      ctx.getSharedPreferences("wos", Context.MODE_PRIVATE).edit()
                          .putInt("row", row)
                          .putInt("max", maxTries)
                          .putLong("delay", delayMs)
                          .apply()
                  }
              }

              private val handler = Handler(Looper.getMainLooper())
              private var running = false
              private var tries = 0
              private var btn: TextView? = null

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  loadPrefs(this)
                  showOverlay()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {
                  running = false
                  setLabel("▶ START")
              }

              override fun onDestroy() {
                  instance = null
                  running = false
                  super.onDestroy()
              }

              private fun pill(color: Int): GradientDrawable {
                  val d = GradientDrawable()
                  d.shape = GradientDrawable.RECTANGLE
                  d.cornerRadius = dp(24).toFloat()
                  d.setColor(color)
                  d.setStroke(dp(2), Color.parseColor("#99FFFFFF"))
                  return d
              }

              private fun setLabel(t: String) {
                  val b = btn ?: return
                  b.text = t
                  b.background = pill(Color.parseColor(if (running) "#E5484D" else "#2B7FFF"))
              }

              private fun toggle() {
                  running = !running
                  if (running) {
                      tries = 0
                      setLabel("■ STOP")
                      step()
                  } else {
                      setLabel("▶ START")
                  }
              }

              fun showOverlay() {
                  if (btn != null) return
                  val manager = getSystemService(WINDOW_SERVICE) as WindowManager
                  val b = TextView(this)
                  b.textSize = 14f
                  b.setTextColor(Color.WHITE)
                  b.setTypeface(null, Typeface.BOLD)
                  b.gravity = Gravity.CENTER
                  b.setPadding(dp(18), dp(10), dp(18), dp(10))
                  b.elevation = dp(6).toFloat()

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = dp(12)
                  lp.y = dp(120)

                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f
                  var moved = false
                  b.setOnTouchListener { v, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = lp.x
                              startY = lp.y
                              touchX = e.rawX
                              touchY = e.rawY
                              moved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - touchX).toInt()
                              val dy = (e.rawY - touchY).toInt()
                              if (abs(dx) > dp(6) || abs(dy) > dp(6)) moved = true
                              if (moved) {
                                  lp.x = startX + dx
                                  lp.y = startY + dy
                                  manager.updateViewLayout(v, lp)
                              }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) toggle()
                              true
                          }
                          else -> false
                      }
                  }

                  manager.addView(b, lp)
                  btn = b
                  setLabel("▶ START")
              }

              private fun step() {
                  if (!running) return
                  if (tries >= maxTries) {
                      running = false
                      setLabel("✔ DONE")
                      return
                  }
                  takeScreenshot(
                      Display.DEFAULT_DISPLAY,
                      mainExecutor,
                      object : TakeScreenshotCallback {
                          override fun onSuccess(result: ScreenshotResult) {
                              val hw = result.hardwareBuffer
                              val hwBmp = Bitmap.wrapHardwareBuffer(hw, result.colorSpace)
                              if (hwBmp == null) {
                                  hw.close()
                                  handler.postDelayed({ step() }, 1500)
                                  return
                              }
                              val bmp = hwBmp.copy(Bitmap.Config.ARGB_8888, false)
                              hwBmp.recycle()
                              hw.close()
                              decide(bmp)
                          }

                          override fun onFailure(errorCode: Int) {
                              handler.postDelayed({ step() }, 1500)
                          }
                      }
                  )
              }

              private fun isBrightBlue(bmp: Bitmap, refX: Float, refY: Float): Boolean {
                  val cx = (refX / REF_W * bmp.width).toInt()
                  val cy = (refY / REF_H * bmp.height).toInt()
                  val half = (0.008f * bmp.width).toInt()
                  var hit = 0
                  var total = 0
                  for (x in maxOf(cx - half, 0) until minOf(cx + half, bmp.width)) {
                      for (y in maxOf(cy - half, 0) until minOf(cy + half, bmp.height)) {
                          val p = bmp.getPixel(x, y)
                          total++
                          if (Color.blue(p) > 220 && Color.green(p) > 130 && Color.red(p) < 150) hit++
                      }
                  }
                  return total > 0 && hit * 100 / total >= 70
              }

              private fun decide(bmp: Bitmap) {
                  val w = bmp.width
                  val h = bmp.height

                  // Экран с большой кнопкой "Соверш." -> нажать её, чтобы начать новую попытку
                  if (isBrightBlue(bmp, COMPLETE_CHECK[0], COMPLETE_CHECK[1])) {
                      bmp.recycle()
                      setLabel("■ $tries  СОВЕРШ.")
                      tap(BTN_COMPLETE[0] / REF_W * w, BTN_COMPLETE[1] / REF_H * h)
                      handler.postDelayed({ step() }, delayMs)
                      return
                  }

                  val cx = (ARROW_X / REF_W * w).toInt()
                  val cy = (ROW_Y[row] / REF_H * h).toInt()
                  val half = (0.03f * w).toInt()
                  var green = 0
                  var red = 0
                  val x0 = maxOf(cx - half, 0)
                  val x1 = minOf(cx + half, w)
                  val y0 = maxOf(cy - half, 0)
                  val y1 = minOf(cy + half, h)
                  for (x in x0 until x1) {
                      for (y in y0 until y1) {
                          val p = bmp.getPixel(x, y)
                          val r = Color.red(p)
                          val g = Color.green(p)
                          val bl = Color.blue(p)
                          if (g > 150 && r < 130 && bl < 130) green++
                          else if (r > 170 && g < 110 && bl < 110) red++
                      }
                  }
                  bmp.recycle()

                  val replace = green > 40 && green > red
                  val target = if (replace) BTN_REPLACE else BTN_RETRY
                  setLabel("■ ${tries + 1}  G$green R$red")
                  tap(target[0] / REF_W * w, target[1] / REF_H * h)
                  tries++
                  handler.postDelayed({ step() }, delayMs)
              }

              private fun tap(x: Float, y: Float) {
                  val path = Path()
                  path.moveTo(x, y)
                  val stroke = GestureDescription.StrokeDescription(path, 0, 60)
                  val gesture = GestureDescription.Builder().addStroke(stroke).build()
                  dispatchGesture(gesture, null, null)
              }
          }
          EOF_9
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: wos-clicker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
